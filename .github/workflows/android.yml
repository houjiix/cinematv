name: CINEMA TV Android CI

on:
push:
branches:
- main
pull_request:
branches:
- main
workflow_dispatch:

permissions:
contents: read

concurrency:
group: android-ci-${{ github.workflow }}-${{ github.ref }}
cancel-in-progress: true

jobs:
build-and-test:
name: Build and test Android application
runs-on: ubuntu-latest
timeout-minutes: 60

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v4
    with:
      accept-android-sdk-licenses: true
      log-accepted-android-sdk-licenses: false
      packages: platform-tools

  - name: Configure Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: 8.11.1

  - name: Validate Gradle wrapper
    run: |
      if [ ! -f ./gradle/wrapper/gradle-wrapper.jar ]; then
        gradle wrapper --gradle-version 8.11.1
      fi

      test -f ./gradlew
      chmod +x ./gradlew
      ./gradlew --no-daemon --version

  - name: Run Android lint
    run: |
      ./gradlew --no-daemon --stacktrace :app:lintDebug

  - name: Run unit tests
    run: |
      ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest

  - name: Run Android emulator tests
    uses: reactivecircus/android-emulator-runner@v2
    with:
      api-level: 35
      target: google_apis
      arch: x86_64
      profile: pixel_7_pro
      disable-animations: true
      script: |
        ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

  - name: Build debug APK
    run: |
      ./gradlew --no-daemon --stacktrace :app:assembleDebug

  - name: Verify APK exists
    run: |
      find app/build/outputs/apk/debug -name "*.apk" -type f
      test -n "$(find app/build/outputs/apk/debug -name "*.apk" -type f -print -quit)"

  - name: Upload debug APK
    uses: actions/upload-artifact@v4
    with:
      name: cinema-tv-debug-apk
      path: app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14

  - name: Upload test and lint reports
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: cinema-tv-test-reports
      path: |
        app/build/reports/
        app/build/test-results/
        app/build/outputs/androidTest-results/
      if-no-files-found: ignore
      retention-days: 14
